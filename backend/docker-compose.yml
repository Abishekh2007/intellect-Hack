services:
  datapilot:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/app/data/ecommerce.db
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - datapilot-data:/app/data
    restart: unless-stopped

volumes:
  datapilot-data:
